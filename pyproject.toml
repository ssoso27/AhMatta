[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahmatta"
version = "0.1.0"
description = "A personal work-tracking application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/ahmatta"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["backend"]
strict = true
